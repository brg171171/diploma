---
- name: Check required Instance Group variable
  ansible.builtin.assert:
    that:
      - prometheus_web_instance_group_id is defined
      - prometheus_web_instance_group_id | length > 0
    fail_msg: "prometheus_web_instance_group_id is not configured"

- name: Install Prometheus dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create Prometheus group
  ansible.builtin.group:
    name: "{{ prometheus_group }}"
    system: true
    state: present

- name: Create Prometheus user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ prometheus_config_dir }}"
      owner: root
      group: "{{ prometheus_group }}"
      mode: "0750"
    - path: "{{ prometheus_file_sd_dir }}"
      owner: root
      group: "{{ prometheus_group }}"
      mode: "0755"
    - path: "{{ prometheus_data_dir }}"
      owner: "{{ prometheus_user }}"
      group: "{{ prometheus_group }}"
      mode: "0750"

- name: Download Prometheus archive
  ansible.builtin.get_url:
    url: "{{ prometheus_download_url }}"
    dest: "/tmp/{{ prometheus_archive }}"
    owner: root
    group: root
    mode: "0644"

- name: Extract Prometheus archive
  ansible.builtin.unarchive:
    src: "/tmp/{{ prometheus_archive }}"
    dest: /tmp
    remote_src: true
    creates: >-
      /tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}/prometheus

- name: Install Prometheus binaries
  ansible.builtin.copy:
    src: >-
      /tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}/{{ item }}
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  loop:
    - prometheus
    - promtool
  notify: Restart Prometheus

- name: Install Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: "{{ prometheus_group }}"
    mode: "0640"
  notify: Restart Prometheus

- name: Install target discovery script
  ansible.builtin.template:
    src: update-prometheus-targets.sh.j2
    dest: /usr/local/sbin/update-prometheus-targets
    owner: root
    group: root
    mode: "0750"

- name: Install Prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Prometheus

- name: Install discovery systemd service
  ansible.builtin.template:
    src: prometheus-yc-discovery.service.j2
    dest: /etc/systemd/system/prometheus-yc-discovery.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install discovery systemd timer
  ansible.builtin.template:
    src: prometheus-yc-discovery.timer.j2
    dest: /etc/systemd/system/prometheus-yc-discovery.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Reload systemd before discovery
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Generate initial Prometheus targets
  ansible.builtin.command:
    cmd: /usr/local/sbin/update-prometheus-targets
  changed_when: false

- name: Check generated Node Exporter targets
  ansible.builtin.command:
    cmd: jq -e 'length > 0' {{ prometheus_file_sd_dir }}/node-exporter.json
  changed_when: false

- name: Check generated Nginx Log Exporter targets
  ansible.builtin.command:
    cmd: jq -e 'length > 0' {{ prometheus_file_sd_dir }}/nginxlog-exporter.json
  changed_when: false

- name: Validate Prometheus configuration
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/promtool
      check config
      {{ prometheus_config_dir }}/prometheus.yml
  changed_when: false

- name: Enable and start discovery timer
  ansible.builtin.systemd_service:
    name: prometheus-yc-discovery.timer
    enabled: true
    state: started

- name: Enable and start Prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true

- name: Apply notified handlers
  ansible.builtin.meta: flush_handlers

- name: Create Prometheus rules directory
  ansible.builtin.file:
    path: /etc/prometheus/rules
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"

- name: Remove legacy duplicate Prometheus alert-rule files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/prometheus/rules/alerts.yml
    - /etc/prometheus/rules/alerts-rules.yml
  notify: Restart Prometheus

- name: Install Prometheus alert rules
  ansible.builtin.template:
    src: alert-rules.yml.j2
    dest: /etc/prometheus/rules/alert-rules.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Reload Prometheus

- name: Configure Prometheus
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Restart Prometheus

- name: Install Alertmanager configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /etc/prometheus/alertmanager.yml
    owner: prometheus
    group: prometheus
    mode: "0640"
  register: alertmanager_configuration
  no_log: true

- name: Validate Alertmanager configuration
  ansible.builtin.command:
    argv:
      - /usr/bin/amtool
      - check-config
      - /etc/prometheus/alertmanager.yml
  changed_when: false

- name: Restart Alertmanager after configuration change
  ansible.builtin.systemd_service:
    name: prometheus-alertmanager
    state: restarted
    enabled: true
  when: alertmanager_configuration.changed


